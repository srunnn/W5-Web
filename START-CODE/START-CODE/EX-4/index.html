<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">

        <div class="sidebar">
            <div class="logo">StudyBoard</div>
            <nav class="nav">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Courses</a>
                <a href="#">Schedule</a>
                <a href="#">Settings</a>
            </nav>
        </div>
    </div>

    <main class="main">

        <header class="header">
            <h1>Dashboard</h1>
            <div class="header-right">
                <span class="date">Thu, 12 Nov 2026</span>
                <div class="profile">
                    <div class="avatar">S</div>
                    <div class="profile-info">
                        <span class="profile-name">Srun</span>
                        <span class="profile-role">Software Engineering Student</span>
                    </div>
                </div>
            </div>
        </header>

        <section class="panel welcome">
            <h2>Welcome bakc, Srun</h2>
            <p>You've hit 80% of your weekly goal. Keep it up.</p>
            <div class="progress"></div>
        </section>

        <section class="stats">
            <div class="panel stat">
                <span class="label">Hours this week</span>
                <span class="value">14.5</span>
            </div>
            <div class="panel stat">
                <span class="label">Day streak</span>
                <span class="value">6</span>
            </div>
            <div class="panel stat">
                <span class="label">Lessons done</span>
                <span class="value">37 / 72</span>
            </div>
        </section>


    </main>
</body>
</html>
